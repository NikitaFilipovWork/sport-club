{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}Training create{% endblock %}

{% block content %}
  <div class="container-fluid px-0">
    <div class="mb-4"><p class="page-kicker">Club schedule</p><h1 class="h2 page-title mb-1">Training create</h1></div>
    <div class="surface p-3 p-md-4" style="max-width: 760px;">
      <form action="" method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Submit" class="btn btn-primary mt-2">
      </form>
    </div>
  </div>
{% endblock %}
