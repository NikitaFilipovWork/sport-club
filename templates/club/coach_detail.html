{% extends "base.html" %}

{% block title %}{{ coach.first_name }} {{ coach.last_name }}{% endblock %}

{% block content %}
<div class="container-fluid px-0">
  <div class="mb-4"><p class="page-kicker">Coach details</p><h1 class="h2 page-title mb-0">{{ coach.first_name }} {{ coach.last_name }}</h1></div>
  <div class="surface p-3 p-md-4 d-flex flex-wrap gap-2">
    <a href="{% url 'club:coach-update' pk=coach.id %}" class="btn btn-primary">Update</a>
    <a href="{% url 'club:coach-delete' pk=coach.id %}" class="btn btn-outline-danger">Delete</a>
  </div>
</div>
{% endblock %}
