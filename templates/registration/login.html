{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}Login{% endblock %}

{% block content %}
  <div class="container-fluid px-0 d-flex justify-content-center">
    <section class="surface p-4 p-md-5 w-100" style="max-width: 480px;">
      <h1 class="h2 page-title mb-4">Login</h1>
      {% if form.errors %}
        <p class="text-danger">Invalid credentials</p>
      {% endif %}
      <form method="post" action="{% url 'club:login' %}">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Submit" class="btn btn-primary mt-2">
      </form>
      <br>
      <a href="{% url "club:signup" %}" class="big text-decoration-none">
        Do not have an account? Sigh up!</a>
    </section>
  </div>
{% endblock %}
